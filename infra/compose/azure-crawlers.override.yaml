# LDLC (desde 2026-11-16, base de produccion `stockfinder`, como Coolmod/PcComponentes) y Neobyte (aun en base AISLADA stockfinder_neobyte_local) (curl_cffi, sin navegador).
# Sustituye a `bash scripts/ldlc_local.sh` y `bash scripts/neobyte_local.sh` del NAS. Neobyte: ningun publicador ni sync-agent apunta a su base.
# Arranque (perfil `crawlers`):  docker compose ... --profile crawlers up -d ldlc-pipeline neobyte-pipeline
x-crawler: &crawler
  image: stockfinder-v2-sync-agent
  working_dir: /app
  environment:
    PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  profiles: [crawlers]
  depends_on:
    postgres: {condition: service_healthy}
  restart: unless-stopped
  mem_limit: 128m
  cpus: 0.5
  pids_limit: 64
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
services:
  ldlc-listing:
    <<: *crawler
    # Refresco rapido de precio y stock desde las paginas de listado (scripts/retailer_listing_refresh.py): una peticion por
    # pagina en vez de una por ficha. Cada 2 h; si el rastreo completo tiene el bloqueo del directorio sale sin hacer nada.
    # Escribe en produccion (ofertas via import_offer/outbox) y en la cache de ldlc; las fichas nuevas o dudosas se consultan como siempre.
    command:
      - sh
      - -c
      - sleep 900; while true; do python scripts/retailer_listing_refresh.py --retailer ldlc --database-url postgresql://stockfinder@postgres/stockfinder --output /output || true; sleep 7200; done
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../nas:/app/nas:ro
      - ../../data:/app/data:ro
      - ../../db:/app/db:ro
      - ../../artifacts/ldlc/checkpoints:/output
  ldlc-pipeline:
    <<: *crawler
    command: [python, scripts/ldlc_pipeline.py, --database-url, 'postgresql://stockfinder@postgres/stockfinder',
              --directory, /output, --watch]
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../nas:/app/nas:ro
      - ../../data:/app/data:ro
      - ../../db:/app/db:ro
      - ../../artifacts/ldlc:/output
  neobyte-crawl:
    <<: *crawler
    # Descubrimiento: relee los listados de categoria cada 24 h (reintento en 1 h si falla) y solo pide las fichas nuevas.
    # Precio y stock de las ya conocidas los refresca neobyte-listing; --refresh (una peticion por ficha) queda para uso manual.
    # Salida residencial: el WAF de Neobyte desafia toda peticion que sale de la IP del datacenter de Azure
    # (403 + cf-mitigated: challenge, incluso en robots.txt). NEOBYTE_PROXY apunta al nodo SOCKS5 del NAS
    # (residencial) que el NAS expone en la VM por el tunel inverso SSH; ver docs/neobyte-local.md.
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      NEOBYTE_PROXY: ${NEOBYTE_PROXY:-}
    command:
      - sh
      - -c
      - while true; do if python scripts/neobyte_local.py --database-url postgresql://stockfinder@postgres/stockfinder_neobyte_local --output /output --watch --refresh-inventory; then sleep 86400; else sleep 3600; fi; done
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../nas:/app/nas:ro
      - ../../data:/app/data:ro
      - ../../db:/app/db:ro
      - ../../artifacts/neobyte/checkpoints:/output
  neobyte-listing:
    <<: *crawler
    # Refresco rapido de precio y stock desde las paginas de listado (scripts/retailer_listing_refresh.py): una peticion por
    # pagina en vez de una por ficha. Cada 2 h; si el rastreo completo tiene el bloqueo del directorio sale sin hacer nada.
    # Solo escribe en la base aislada y en la cache de neobyte; las fichas nuevas o dudosas se consultan como siempre.
    # Misma salida residencial que neobyte-crawl: sin NEOBYTE_PROXY el WAF responde 403 a la IP del datacenter.
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      NEOBYTE_PROXY: ${NEOBYTE_PROXY:-}
    command:
      - sh
      - -c
      - sleep 900; while true; do python scripts/retailer_listing_refresh.py --retailer neobyte --database-url postgresql://stockfinder@postgres/stockfinder_neobyte_local --output /output || true; sleep 7200; done
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../nas:/app/nas:ro
      - ../../data:/app/data:ro
      - ../../db:/app/db:ro
      - ../../artifacts/neobyte/checkpoints:/output
  neobyte-pipeline:
    <<: *crawler
    command: [python, scripts/neobyte_pipeline.py, --database-url, 'postgresql://stockfinder@postgres/stockfinder_neobyte_local',
              --directory, /output, --watch]
    volumes:
      - ../../scripts:/app/scripts:ro
      - ../../nas:/app/nas:ro
      - ../../data:/app/data:ro
      - ../../db:/app/db:ro
      - ../../artifacts/neobyte:/output
